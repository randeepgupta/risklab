<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Shape Outline -->
  <path d="M 256 96 C 330 96 370 128 370 180 C 370 290 286 366 256 396 C 226 366 142 290 142 180 C 142 128 182 96 256 96 Z"
        fill="url(#shieldGrad)" stroke="#334155" stroke-width="6" />

  <!-- Glowing Normal Distribution Bell Curve inside Shield -->
  <path d="M 160 310 C 190 310 215 285 235 210 C 245 170 256 160 256 160 C 256 160 267 170 277 210 C 297 285 322 310 352 310"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Quant Sigma / Delta Symbol -->
  <circle cx="256" cy="180" r="14" fill="#10b981" />
  <path d="M 200 310 L 312 310" stroke="#475569" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Risk Horizon Cutoff Line (VaR indicator) -->
  <line x1="210" y1="210" x2="210" y2="310" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4" />
  <circle cx="210" cy="270" r="5" fill="#f43f5e" />

  <!-- Wordmark Tag -->
  <text x="256" y="440" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="6">
    RISK<tspan fill="#34d399">LAB</tspan>
  </text>
</svg>
