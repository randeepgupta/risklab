name: RiskLab validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risklab-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: RiskLab validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run report:risk-models
      - run: npm run lint
      - run: npm run test:quant
      - run: npm run test:history
      - run: npm run test:ai
      - run: npm run test:symbols
      - run: npm run test:sample
      - run: npm run test:future
      - run: npm run test:portfolios
      - run: npm run test:csv
      - run: npm run test:refresh
      - run: npm run build
      - run: npm run build:cloudflare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: risklab-model-data-report
          path: artifacts/risk-model-report.*
          if-no-files-found: ignore
          retention-days: 14
